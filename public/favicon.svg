<svg width="64" height="64" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
  <!-- Квадрат с голубым фоном -->
  <rect
    x="1"
    y="1"
    width="28"
    height="28"
    rx="4"
    ry="4"
    fill="#fff"
    stroke="transparent"
    stroke-width="2"
    stroke-linejoin="miter"
  />

  <!-- Логотип MD центрированный -->
  <g
    fill="none"
    stroke="#000"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(2 0)"
  >
    <!-- Буква M -->
    <path d="M5,22 L5,8 L10,16 L15,8 L15,22" />

    <!-- Буква D, правая палка M = левая стенка D -->
    <path
      d="M15,8
         L15,22
         C15,22 23,22 23,15
         C23,8 15,8 15,8 Z"
    />
  </g>
</svg>
